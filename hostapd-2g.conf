interface=wlan1
# driver=nl80211
ssid=Pi_Firewall_2G
hw_mode=g
channel=1
ieee80211n=1
wmm_enabled=1
auth_algs=1
ignore_broadcast_ssid=0
# Authentication & Encryption
wpa=2
wpa_passphrase=<YOUR_SECURE_PASSWORD_HERE>
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP
# Force 20MHz width (Fixes "Forty MHz Intolerant" disconnects)
ht_capab=[HT20][SHORT-GI-20]
